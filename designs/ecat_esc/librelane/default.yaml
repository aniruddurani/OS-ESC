# Default configuration: the size the tests run at (see tb/run.py).
DESIGN_NAME: esc_top
VERILOG_FILES: dir::../rtl/*.v
CLOCK_PORT: [clk, rx_clk, tx_clk]
CLOCK_PERIOD: 10
PNR_SDC_FILE: dir::esc.sdc
SIGNOFF_SDC_FILE: dir::esc.sdc

SYNTH_PARAMETERS:
  - N_FMMU=3
  - N_SM=4
  - RAM_BYTES=256
  - DIAG_EN=1
  - TRACE_DEPTH=8
  - CNT_W=16
  - FIFO_DEPTH=16

FP_CORE_UTIL: 35

# The RAM macro as a blackbox declaration, so lint and synthesis resolve the instance in
# pdram_macro.v (unused in this configuration).
EXTRA_VERILOG_MODELS:
  - dir::../tb/lint/sky130_sram_1kbyte_1rw1r_8x1024_8.v
